name: Test

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Install Playwright browsers
        run: pnpm --filter @ta/test run setup-browsers:ci

      - name: Test affected packages
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          # Better Auth is initialized when Vitest loads `@ta/api` / `@ta/auth` (no repo `.env` in CI).
          BETTER_AUTH_SECRET: ci-test-only-placeholder-not-used-at-runtime-32
          BETTER_AUTH_URL: http://localhost:3001
          NEXT_PUBLIC_WEB_STRATEGIES_URL: http://localhost:3000
        run: pnpm turbo run test --affected
