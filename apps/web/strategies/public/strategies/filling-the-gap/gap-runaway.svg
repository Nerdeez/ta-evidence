<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="gap-runaway-title">
  <title id="gap-runaway-title">Schematic runaway gap in the middle of an uptrend</title>
  <style>
    .bg { fill: #ffffff; }
    .axis { stroke: #000000; stroke-width: 1.5; fill: none; }
    .grid { stroke: #eeeeee; stroke-width: 1; }
    .day-line { stroke: #dddddd; stroke-width: 1; }
    .label { fill: #000000; font-family: system-ui, sans-serif; font-size: 12px; }
    .date-label { fill: #000000; font-family: system-ui, sans-serif; font-size: 9px; text-anchor: middle; }
    .wick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .body-white { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
    .body-black { fill: #000000; stroke: none; }
    .gap-shade { fill: #000000; fill-opacity: 0.08; }
    .measure { stroke: #666666; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>
  <rect width="400" height="260" class="bg" />
  <g class="grid">
    <line x1="48" y1="60" x2="360" y2="60" />
    <line x1="48" y1="110" x2="360" y2="110" />
    <line x1="48" y1="160" x2="360" y2="160" />
    <line x1="48" y1="210" x2="360" y2="210" />
  </g>
  <line x1="48" y1="35" x2="48" y2="210" class="axis" />
  <line x1="48" y1="210" x2="360" y2="210" class="axis" />
  <text x="16" y="130" class="label" transform="rotate(-90 16 130)">Price</text>
  <text x="56" y="228" class="date-label">2024/01/08</text>
  <text x="176" y="228" class="date-label">2024/01/15</text>
  <line x1="56" y1="195" x2="164" y2="95" class="measure" />
  <line x1="164" y1="95" x2="272" y2="45" class="measure" />
  <g class="day-line">
    <line x1="56" y1="35" x2="56" y2="210" /><line x1="74" y1="35" x2="74" y2="210" />
    <line x1="92" y1="35" x2="92" y2="210" /><line x1="110" y1="35" x2="110" y2="210" />
    <line x1="128" y1="35" x2="128" y2="210" /><line x1="146" y1="35" x2="146" y2="210" />
    <line x1="164" y1="35" x2="164" y2="210" /><line x1="182" y1="35" x2="182" y2="210" />
    <line x1="200" y1="35" x2="200" y2="210" /><line x1="218" y1="35" x2="218" y2="210" />
    <line x1="236" y1="35" x2="236" y2="210" /><line x1="254" y1="35" x2="254" y2="210" />
  </g>
  <g><line x1="56" y1="168" x2="56" y2="205" class="wick" /><rect x="52" y="178" width="8" height="12" class="body-white" /></g>
  <g><line x1="74" y1="158" x2="74" y2="198" class="wick" /><rect x="70" y="166" width="8" height="14" class="body-white" /></g>
  <g><line x1="92" y1="148" x2="92" y2="188" class="wick" /><rect x="88" y="156" width="8" height="14" class="body-white" /></g>
  <g><line x1="110" y1="138" x2="110" y2="178" class="wick" /><rect x="106" y="146" width="8" height="14" class="body-white" /></g>
  <g><line x1="128" y1="128" x2="128" y2="168" class="wick" /><rect x="124" y="136" width="8" height="14" class="body-white" /></g>
  <rect x="136" y="108" width="12" height="22" class="gap-shade" />
  <g><line x1="146" y1="88" x2="146" y2="118" class="wick" /><rect x="142" y="96" width="8" height="12" class="body-white" /></g>
  <g><line x1="164" y1="72" x2="164" y2="108" class="wick" /><rect x="160" y="80" width="8" height="14" class="body-white" /></g>
  <g><line x1="182" y1="58" x2="182" y2="94" class="wick" /><rect x="178" y="66" width="8" height="14" class="body-white" /></g>
  <g><line x1="200" y1="48" x2="200" y2="82" class="wick" /><rect x="196" y="54" width="8" height="14" class="body-white" /></g>
  <g><line x1="218" y1="38" x2="218" y2="72" class="wick" /><rect x="214" y="44" width="8" height="14" class="body-white" /></g>
  <g><line x1="236" y1="32" x2="236" y2="62" class="wick" /><rect x="232" y="38" width="8" height="12" class="body-white" /></g>
  <g><line x1="254" y1="28" x2="254" y2="58" class="wick" /><rect x="250" y="34" width="8" height="12" class="body-white" /></g>
</svg>
