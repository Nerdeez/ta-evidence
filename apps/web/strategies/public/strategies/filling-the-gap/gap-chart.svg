  <g><line x1="268" y1="118" x2="268" y2="152" class="wick" /><rect x="264" y="118" width="8" height="10" class="body-black" /></g>
  <g><line x1="285" y1="124" x2="285" y2="158" class="wick" /><rect x="281" y="132" width="8" height="10" class="body-white" /></g>

  <!-- week 3 -->
  <g><line x1="302" y1="128" x2="302" y2="162" class="wick" /><rect x="298" y="136" width="8" height="10" class="body-white" /></g>
  <g><line x1="319" y1="132" x2="319" y2="166" class="wick" /><rect x="315" y="132" width="8" height="10" class="body-black" /></g>
  <g><line x1="336" y1="138" x2="336" y2="172" class="wick" /><rect x="332" y="146" width="8" height="10" class="body-white" /></g>
  <g><line x1="353" y1="142" x2="353" y2="176" class="wick" /><rect x="349" y="150" width="8" height="10" class="body-white" /></g>
  <g><line x1="370" y1="148" x2="370" y2="182" class="wick" /><rect x="366" y="148" width="8" height="10" class="body-black" /></g>
  <g><line x1="387" y1="154" x2="387" y2="188" class="wick" /><rect x="383" y="162" width="8" height="10" class="body-white" /></g>
  <g><line x1="404" y1="158" x2="404" y2="192" class="wick" /><rect x="400" y="166" width="8" height="10" class="body-white" /></g>

  <!-- week 4 -->
  <g><line x1="421" y1="162" x2="421" y2="196" class="wick" /><rect x="417" y="162" width="8" height="10" class="body-black" /></g>
  <g><line x1="438" y1="158" x2="438" y2="192" class="wick" /><rect x="434" y="166" width="8" height="10" class="body-white" /></g>
  <g><line x1="455" y1="152" x2="455" y2="186" class="wick" /><rect x="451" y="160" width="8" height="10" class="body-white" /></g>
  <g><line x1="472" y1="146" x2="472" y2="180" class="wick" /><rect x="468" y="146" width="8" height="10" class="body-black" /></g>
  <g><line x1="489" y1="140" x2="489" y2="174" class="wick" /><rect x="485" y="148" width="8" height="10" class="body-white" /></g>
  <g><line x1="506" y1="134" x2="506" y2="168" class="wick" /><rect x="502" y="142" width="8" height="10" class="body-white" /></g>
  <g><line x1="523" y1="128" x2="523" y2="162" class="wick" /><rect x="519" y="128" width="8" height="10" class="body-black" /></g>

  <!-- week 5 -->
  <g><line x1="540" y1="122" x2="540" y2="156" class="wick" /><rect x="536" y="130" width="8" height="10" class="body-white" /></g>
  <g><line x1="557" y1="116" x2="557" y2="150" class="wick" /><rect x="553" y="124" width="8" height="10" class="body-white" /></g>
  <g><line x1="574" y1="110" x2="574" y2="144" class="wick" /><rect x="570" y="110" width="8" height="10" class="body-black" /></g>
  <g><line x1="591" y1="104" x2="591" y2="138" class="wick" /><rect x="587" y="112" width="8" height="10" class="body-white" /></g>
  <g><line x1="608" y1="98" x2="608" y2="132" class="wick" /><rect x="604" y="106" width="8" height="10" class="body-white" /></g>
  <g><line x1="625" y1="92" x2="625" y2="126" class="wick" /><rect x="621" y="92" width="8" height="10" class="body-black" /></g>
  <g><line x1="642" y1="86" x2="642" y2="120" class="wick" /><rect x="638" y="94" width="8" height="10" class="body-white" /></g>

  <!-- gap callout: vertical arrow from above -->
  <text x="124" y="46" class="gap-text">gap</text>
  <line x1="124" y1="52" x2="124" y2="112" class="gap-callout" marker-end="url(#gap-arrowhead)" />
</svg>
