<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="gap-chart-title">
  <title id="gap-chart-title">Candlestick chart with a gap up marked by a circle</title>

  <style>
    .bg { fill: #ffffff; }
    .axis { stroke: #000000; stroke-width: 1.5; fill: none; }
    .grid { stroke: #eeeeee; stroke-width: 1; }
    .day-line { stroke: #dddddd; stroke-width: 1; }
    .label { fill: #000000; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
    .date-label { fill: #000000; font-family: system-ui, -apple-system, sans-serif; font-size: 9px; text-anchor: middle; }
    .price-label { fill: #333333; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: end; }
    .wick { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
    .body-white { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
    .body-black { fill: #000000; stroke: none; }
    .gap-ring { fill: none; stroke: #000000; stroke-width: 1.5; }
    .gap-shade { fill: #000000; fill-opacity: 0.06; }
    .gap-callout { stroke: #dc2626; stroke-width: 1.5; fill: none; }
    .gap-text { fill: #dc2626; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
  </style>

  <defs>
    <marker id="gap-arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="680" height="300" class="bg" />

  <g class="grid">
    <line x1="52" y1="55" x2="660" y2="55" />
    <line x1="52" y1="100" x2="660" y2="100" />
    <line x1="52" y1="145" x2="660" y2="145" />
    <line x1="52" y1="190" x2="660" y2="190" />
    <line x1="52" y1="235" x2="660" y2="235" />
  </g>

  <!-- 35 trading days, 7 per week, step 17px -->
  <g class="day-line">
    <line x1="64" y1="32" x2="64" y2="235" />
    <line x1="81" y1="32" x2="81" y2="235" />
    <line x1="98" y1="32" x2="98" y2="235" />
    <line x1="115" y1="32" x2="115" y2="235" />
    <line x1="132" y1="32" x2="132" y2="235" />
    <line x1="149" y1="32" x2="149" y2="235" />
    <line x1="166" y1="32" x2="166" y2="235" />
    <line x1="183" y1="32" x2="183" y2="235" />
    <line x1="200" y1="32" x2="200" y2="235" />
    <line x1="217" y1="32" x2="217" y2="235" />
    <line x1="234" y1="32" x2="234" y2="235" />
    <line x1="251" y1="32" x2="251" y2="235" />
    <line x1="268" y1="32" x2="268" y2="235" />
    <line x1="285" y1="32" x2="285" y2="235" />
    <line x1="302" y1="32" x2="302" y2="235" />
    <line x1="319" y1="32" x2="319" y2="235" />
    <line x1="336" y1="32" x2="336" y2="235" />
    <line x1="353" y1="32" x2="353" y2="235" />
    <line x1="370" y1="32" x2="370" y2="235" />
    <line x1="387" y1="32" x2="387" y2="235" />
    <line x1="404" y1="32" x2="404" y2="235" />
    <line x1="421" y1="32" x2="421" y2="235" />
    <line x1="438" y1="32" x2="438" y2="235" />
    <line x1="455" y1="32" x2="455" y2="235" />
    <line x1="472" y1="32" x2="472" y2="235" />
    <line x1="489" y1="32" x2="489" y2="235" />
    <line x1="506" y1="32" x2="506" y2="235" />
    <line x1="523" y1="32" x2="523" y2="235" />
    <line x1="540" y1="32" x2="540" y2="235" />
    <line x1="557" y1="32" x2="557" y2="235" />
    <line x1="574" y1="32" x2="574" y2="235" />
    <line x1="591" y1="32" x2="591" y2="235" />
    <line x1="608" y1="32" x2="608" y2="235" />
    <line x1="625" y1="32" x2="625" y2="235" />
    <line x1="642" y1="32" x2="642" y2="235" />
  </g>

  <line x1="52" y1="32" x2="52" y2="235" class="axis" />
  <line x1="52" y1="235" x2="660" y2="235" class="axis" />

  <text x="18" y="140" class="label" transform="rotate(-90 18 140)">Price</text>

  <text x="46" y="239" class="price-label">50</text>
  <text x="46" y="194" class="price-label">55</text>
  <text x="46" y="149" class="price-label">60</text>
  <text x="46" y="104" class="price-label">65</text>
  <text x="46" y="59" class="price-label">70</text>

  <!-- one date label per week (7 trading days apart) -->
  <text x="64" y="254" class="date-label">2024/01/08</text>
  <text x="183" y="254" class="date-label">2024/01/15</text>
  <text x="302" y="254" class="date-label">2024/01/22</text>
  <text x="421" y="254" class="date-label">2024/01/29</text>
  <text x="540" y="254" class="date-label">2024/02/05</text>

  <!-- week 1: Jan 8-16 (7 days) -->
  <g><line x1="64" y1="205" x2="64" y2="228" class="wick" /><rect x="60" y="214" width="8" height="8" class="body-black" /></g>
  <g><line x1="81" y1="196" x2="81" y2="228" class="wick" /><rect x="77" y="204" width="8" height="12" class="body-white" /></g>
  <g><line x1="98" y1="178" x2="98" y2="218" class="wick" /><rect x="94" y="186" width="8" height="14" class="body-white" /></g>
  <g><line x1="115" y1="152" x2="115" y2="202" class="wick" /><rect x="111" y="162" width="8" height="16" class="body-white" /></g>

  <!-- gap: Jan 11 -> Jan 12 -->
  <rect x="122" y="118" width="12" height="34" class="gap-shade" />
  <ellipse cx="124" cy="135" rx="16" ry="20" class="gap-ring" />

  <g><line x1="132" y1="88" x2="132" y2="118" class="wick" /><rect x="128" y="96" width="8" height="12" class="body-white" /></g>
  <g><line x1="149" y1="82" x2="149" y2="118" class="wick" /><rect x="145" y="90" width="8" height="12" class="body-white" /></g>
  <g><line x1="166" y1="88" x2="166" y2="122" class="wick" /><rect x="162" y="88" width="8" height="10" class="body-black" /></g>

  <!-- week 2 -->
  <g><line x1="183" y1="92" x2="183" y2="126" class="wick" /><rect x="179" y="100" width="8" height="10" class="body-white" /></g>
  <g><line x1="200" y1="96" x2="200" y2="130" class="wick" /><rect x="196" y="104" width="8" height="10" class="body-white" /></g>
  <g><line x1="217" y1="102" x2="217" y2="136" class="wick" /><rect x="213" y="102" width="8" height="10" class="body-black" /></g>
  <g><line x1="234" y1="108" x2="234" y2="142" class="wick" /><rect x="230" y="116" width="8" height="10" class="body-white" /></g>
